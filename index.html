<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Temporal Labeller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="title">Temporal Labeller</h1>
    <div class="progress">
      <div class="bar" id="bar" aria-hidden="true"></div>
      <span class="counts" id="counts">No manifest loaded</span>
    </div>
    <label class="hint showlbl" for="filter">Show</label>
    <select id="filter">
      <option value="all">All</option>
      <option value="unlabeled">Unlabelled only</option>
    </select>
    <details class="more"><summary class="btn">Files ▾</summary><div class="tools">
      <label class="btn" for="loadManifest">Open manifest…</label>
      <input type="file" id="loadManifest" accept=".json,application/json">
      <button class="btn" id="exportGeo" type="button">Export GeoJSON</button>
      <button class="btn" id="exportCsv" type="button">Export CSV</button>
      <button class="btn" id="exportLabels" type="button">Save labels</button>
      <label class="btn" for="importLabels">Load labels…</label>
      <input type="file" id="importLabels" accept=".json,application/json">
    </div></details>
  </div>
</header>

<main>
  <div class="wrap" id="app" hidden>
    <div class="nav">
      <button class="btn" id="prev" type="button">← Previous</button>
      <button class="btn" id="next" type="button">Next →</button>
      <span class="pos" id="pos"></span>
      <span class="hint" id="keyhint">Keys: ← → to move, number keys to label. Click an image to enlarge.</span>
    </div>

    <section class="strip" id="strip" aria-label="Satellite images, oldest first"></section>

    <section class="detail">
      <div class="card" id="facts"></div>
      <div class="card label">
        <h2 id="question">Is the target present?</h2>
        <div class="choices" id="choices" role="group" aria-label="Label"></div>
        <textarea id="note" placeholder="Optional note, e.g. cloud edge, tidal flat, sensor artifact"></textarea>
        <div class="status" id="status"></div>
      </div>
    </section>
  </div>
  <div class="empty" id="empty">
    <p>Open a manifest to start labelling, or add <code>?manifest=path/to/manifest.json</code> to the URL.</p>
    <p><a href="?manifest=examples/herring-spawn/manifest.json">Try the example (herring spawn, Sentinel-2)</a></p>
  </div>
</main>

<div class="zoom" id="zoom" hidden><div id="zoomImg" role="img" aria-label="Enlarged image"><img id="zoomPic" alt=""></div><p id="zoomCap"></p></div>

<script src="app.js"></script>
</body>
</html>
